{% extends "base.html" %}
{% block title %}收录资料 · {{ site_name }}{% endblock %}
{% block content %}
<div class="page-head">
  <div><span class="eyebrow">Passive Capture</span><h1>收录科研资料</h1><p>先保存，后整理。系统会自动提取 PDF、Word、PPT、文本与表格中的可检索内容。</p></div>
</div>
<form class="panel form-panel" method="post" enctype="multipart/form-data">
  <label class="dropzone" id="dropzone">
    <input type="file" name="files" id="fileInput" multiple required>
    <div class="drop-icon">⇧</div>
    <h2>拖入文档、图片、代码或数据集</h2>
    <p>也可以点击选择；支持一次上传多个文件，单次请求上限 1 GB。</p>
    <div id="fileList" class="selected-files"></div>
  </label>
  <div class="form-grid">
    <label><span>自定义标题</span><input name="title" placeholder="仅上传单个文件时生效；留空则用文件名"></label>
    <label><span>资料类型</span><select name="kind"><option value="auto">自动识别</option>{% for key, meta in kinds.items() %}<option value="{{ key }}">{{ meta[1] }} {{ meta[0] }}</option>{% endfor %}</select></label>
    <label><span>研究领域</span><select name="domain">{% for item in domains %}<option value="{{ item }}">{{ item }}</option>{% endfor %}</select></label>
    <label><span>标签</span><input name="tags" placeholder="例如：EG, CV, 导电网络, 必读"></label>
    <label class="full"><span>来源 / DOI / 项目路径</span><input name="source" placeholder="例如 DOI、论文链接、实验批次或代码仓库路径"></label>
    <label class="full"><span>为什么要保存它</span><textarea name="summary" rows="4" placeholder="一句话即可：它解决什么问题、与我的研究有什么关系。可以暂时留空。"></textarea></label>
  </div>
  <div class="form-actions"><a href="{{ url_for('library') }}">取消</a><button class="primary-button" type="submit">收录并增加修为</button></div>
</form>
{% endblock %}
