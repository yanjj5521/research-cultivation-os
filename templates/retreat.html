{% extends "base.html" %}
{% block title %}入定闭关 · {{ site_name }}{% endblock %}
{% block content %}
<div class="page-head retreat-head">
  <div><span class="eyebrow">Deep Focus</span><h1>入定闭关</h1><p>选定这一段时间唯一要做的事。倒计时保存在当前浏览器，刷新页面也不会重新开始。</p></div>
  <a class="soft-button" href="{{ url_for('daily_page') }}">查看今日任务</a>
</div>

<section class="retreat-shell">
  <div class="retreat-scene">
    <div class="retreat-moon"></div>
    <div class="retreat-ridge ridge-back"></div>
    <div class="retreat-ridge ridge-front"></div>
    <div class="retreat-orbit" id="retreatOrbit">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle class="orbit-track" cx="120" cy="120" r="108"></circle>
        <circle class="orbit-progress" id="retreatProgress" cx="120" cy="120" r="108"></circle>
      </svg>
      <div class="retreat-clock">
        <small id="retreatState">尚未入定</small>
        <strong id="retreatTime">25:00</strong>
        <span id="retreatFocusLabel">请选择闭关所修</span>
      </div>
    </div>
  </div>

  <aside class="retreat-controls panel">
    <div><span class="eyebrow">本次所修</span><h2>只定一件事</h2></div>
    <label><span>闭关目标</span><input id="retreatFocus" maxlength="80" placeholder="例如：读懂论文 Figure 3 并写一张图卡"></label>
    <div class="retreat-presets" aria-label="时长预设">
      <button type="button" data-minutes="25">25 分钟<small>小周天</small></button>
      <button type="button" data-minutes="45">45 分钟<small>一炷香</small></button>
      <button type="button" data-minutes="90">90 分钟<small>深闭关</small></button>
    </div>
    <label><span>自定义分钟</span><input id="retreatMinutes" type="number" min="1" max="480" value="25"></label>
    <div class="retreat-buttons">
      <button class="primary-button" id="retreatStart" type="button">开始闭关</button>
      <button class="soft-button" id="retreatPause" type="button">暂停</button>
      <button class="text-button" id="retreatReset" type="button">结束本次</button>
    </div>
    <div class="retreat-finish-links" id="retreatFinishLinks" hidden>
      <strong>出关后留下一点证据</strong>
      <p>不要求长篇总结，只记录刚刚完成了什么、还卡在哪里。</p>
      <div><a class="soft-button" href="{{ url_for('note_new') }}">写闭关笔记</a><a class="primary-button" href="{{ url_for('daily_page') }}">去交付任务</a></div>
    </div>
    <small class="retreat-note">关闭浏览器不会收到系统通知；下次打开本页时，会根据真实结束时间恢复状态。</small>
  </aside>
</section>
{% endblock %}
