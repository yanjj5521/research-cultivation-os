name: Validate Private Development Candidate

on:
  push:
    branches: [development/next]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: development-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-start:
    runs-on: ubuntu-latest
    steps:
      - name: Mark candidate as validating
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=private-development-gate \
            -f description="Validating Windows EXEs and Android APK" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  windows-candidate:
    needs: candidate-start
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Test source and real ResearchHub channel
        run: |
          python self_test.py
          python self_test.py --integration
          python hub_self_test.py
          python migration_test.py
          python online_integration_test.py
      - name: Build and smoke-test both Windows executables
        shell: pwsh
        run: |
          python packaging/build_icons.py
          pyinstaller --noconfirm --clean packaging/ResearchOS.spec
          pyinstaller --noconfirm --clean packaging/ResearchHub.spec
          & ".\dist\ResearchOS.exe" --data-dir (Join-Path $env:RUNNER_TEMP "personal") --self-check
          if ($LASTEXITCODE -ne 0) { throw "Personal executable self-check failed." }
          & ".\dist\ResearchHub.exe" --data-dir (Join-Path $env:RUNNER_TEMP "hub") --self-check
          if ($LASTEXITCODE -ne 0) { throw "Hub executable self-check failed." }

  android-candidate:
    needs: candidate-start
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test, lint, build and verify APK
        shell: bash
        run: |
          gradle --no-daemon -p mobile/android \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug
          apk="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep "package: name='cn.wendao.researchos.mobile'"

  candidate-result:
    if: always()
    needs: [windows-candidate, android-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Publish combined candidate result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RESULT: ${{ needs.windows-candidate.result }}
          ANDROID_RESULT: ${{ needs.android-candidate.result }}
        run: |
          state=failure
          description="Candidate failed; inspect Windows or Android job"
          if [[ "$WINDOWS_RESULT" == "success" && "$ANDROID_RESULT" == "success" ]]; then
            state=success
            description="Windows EXEs and Android APK passed"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context=private-development-gate \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          [[ "$state" == "success" ]]
