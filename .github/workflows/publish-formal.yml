name: Publish formal release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  release-start:
    if: "github.event.head_commit.message == 'release: stage formal 1.0 assets'"
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=formal-release-gate \
            -f description="Publishing artifact-only formal 1.0" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  publish:
    needs: release-start
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify private build products
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import urllib.request
          import zipfile
          from pathlib import Path

          staging = Path("release-staging")
          downloads = Path("downloads")
          output = Path("out")
          downloads.mkdir()
          output.mkdir()
          manifest = json.loads((staging / "manifest.json").read_text(encoding="utf-8"))

          for archive in manifest["archives"]:
              target = downloads / archive["name"]
              request = urllib.request.Request(
                  archive["url"],
                  headers={"User-Agent": "ResearchSystem-Formal-Release/1.0"},
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  with target.open("wb") as destination:
                      shutil.copyfileobj(response, destination)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              if digest != archive["sha256"]:
                  raise SystemExit(f"Archive SHA-256 mismatch: {archive['name']}")
              with zipfile.ZipFile(target) as bundle:
                  for member in bundle.infolist():
                      resolved = (output / member.filename).resolve()
                      if output.resolve() not in resolved.parents and resolved != output.resolve():
                          raise SystemExit(f"Unsafe archive path: {member.filename}")
                  bundle.extractall(output)

          expected = {artifact["name"] for artifact in manifest["artifacts"]}
          actual = {path.name for path in output.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"Unexpected product set: expected {sorted(expected)}, got {sorted(actual)}")

          sums = []
          for artifact in manifest["artifacts"]:
              target = output / artifact["name"]
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              if digest != artifact["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch: {artifact['name']}")
              sums.append(f"{digest}  {artifact['name']}")
          (output / "SHA256SUMS.txt").write_text("\n".join(sums) + "\n", encoding="utf-8")
          PY
      - name: Publish immutable formal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(cat VERSION)" = "1.0.0"
          if gh release view formal-v1.0.0 >/dev/null 2>&1; then
            echo "formal-v1.0.0 already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create formal-v1.0.0 out/* \
            --target release/formal-v1.0.0 \
            --title "科研系统 正式版 1.0" \
            --notes-file RELEASE_NOTES.md \
            --latest

  release-result:
    if: "always() && needs.release-start.result != 'skipped'"
    needs: [release-start, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Publish formal release result
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          state=failure
          description="Formal 1.0 publication failed"
          if [[ "$PUBLISH_RESULT" == "success" ]]; then
            state=success
            description="Artifact-only formal 1.0 published"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context=formal-release-gate \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          [[ "$state" == "success" ]]
