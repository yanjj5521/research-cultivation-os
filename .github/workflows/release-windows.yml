name: Build Desktop and Android Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - requirements.txt
      - requirements-build.txt
      - "*.py"
      - "features/**"
      - "services/**"
      - "templates/**"
      - "static/**"
      - "hub_templates/**"
      - "hub_static/**"
      - "mobile/**"
      - "packaging/**"
      - "docs/releases/**"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immutable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out stable source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must use semantic versioning."
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run application checks
        run: |
          python self_test.py
          python self_test.py --integration
          python hub_self_test.py
          python migration_test.py
          python online_integration_test.py

      - name: Build personal and hub executables
        run: |
          pyinstaller --noconfirm --clean packaging/ResearchOS.spec
          pyinstaller --noconfirm --clean packaging/ResearchHub.spec

      - name: Smoke-test packaged executables
        shell: pwsh
        run: |
          $testData = Join-Path $env:RUNNER_TEMP "research-os-smoke"
          & ".\dist\ResearchOS.exe" --data-dir $testData --self-check
          if ($LASTEXITCODE -ne 0) { throw "Packaged personal-node self-check failed." }
          $hubTestData = Join-Path $env:RUNNER_TEMP "research-hub-smoke"
          & ".\dist\ResearchHub.exe" --data-dir $hubTestData --self-check
          if ($LASTEXITCODE -ne 0) { throw "Packaged hub self-check failed." }

      - name: Assemble direct EXEs and complete ZIP
        shell: pwsh
        run: |
          $releaseName = "ResearchCultivationOS-v$env:APP_VERSION-Windows-x64"
          $personalExeName = "ResearchOS-v$env:APP_VERSION-Windows-x64.exe"
          $hubExeName = "ResearchHub-v$env:APP_VERSION-Windows-x64.exe"
          $personalExe = Join-Path "out" $personalExeName
          $hubExe = Join-Path "out" $hubExeName
          $releaseRoot = Join-Path "release" $releaseName
          New-Item -ItemType Directory -Path "out" -Force | Out-Null
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null
          Copy-Item "dist\ResearchOS.exe" $personalExe -Force
          Copy-Item "dist\ResearchHub.exe" $hubExe -Force
          Copy-Item "dist\ResearchOS.exe" (Join-Path $releaseRoot "ResearchOS.exe") -Force
          Copy-Item "dist\ResearchHub.exe" (Join-Path $releaseRoot "ResearchHub.exe") -Force
          Copy-Item "packaging\windows\*.cmd" $releaseRoot -Force
          Copy-Item "packaging\USER_README.txt" $releaseRoot -Force
          Copy-Item "VERSION" $releaseRoot -Force
          Compress-Archive `
            -Path $releaseRoot `
            -DestinationPath (Join-Path "out" "$releaseName.zip") `
            -CompressionLevel Optimal

      - name: Upload Windows release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/*
          if-no-files-found: error
          retention-days: 14

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out stable source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read version
        shell: bash
        run: |
          version="$(tr -d '\r\n ' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use semantic versioning." >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test, lint and build Android client
        shell: bash
        run: |
          gradle --no-daemon -p mobile/android \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Verify and assemble APK
        shell: bash
        run: |
          source_apk="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          target_apk="out/ResearchOS-Mobile-v${APP_VERSION}-Android.apk"
          test -s "$source_apk"
          mkdir -p out
          cp "$source_apk" "$target_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$target_apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$target_apk" |
            grep "package: name='cn.wendao.researchos.mobile'"

      - name: Upload Android release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [windows-release, android-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          version="$(tr -d '\r\n ' < VERSION)"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Download Windows candidates
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release

      - name: Download Android candidate
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release

      - name: Verify complete product set
        shell: bash
        run: |
          personal="ResearchOS-v${APP_VERSION}-Windows-x64.exe"
          hub="ResearchHub-v${APP_VERSION}-Windows-x64.exe"
          suite="ResearchCultivationOS-v${APP_VERSION}-Windows-x64.zip"
          android="ResearchOS-Mobile-v${APP_VERSION}-Android.apk"
          for asset in "$personal" "$hub" "$suite" "$android"; do
            test -s "release/$asset"
          done
          (
            cd release
            sha256sum "$personal" "$hub" "$suite" "$android" > SHA256SUMS.txt
          )

      - name: Publish immutable version assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${APP_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; immutable assets were not replaced."
            exit 0
          fi
          gh release create "$tag" \
            release/ResearchOS-v${APP_VERSION}-Windows-x64.exe \
            release/ResearchHub-v${APP_VERSION}-Windows-x64.exe \
            release/ResearchCultivationOS-v${APP_VERSION}-Windows-x64.zip \
            release/ResearchOS-Mobile-v${APP_VERSION}-Android.apk \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "问道科研 v${APP_VERSION}" \
            --notes-file "docs/releases/v${APP_VERSION}.md"
