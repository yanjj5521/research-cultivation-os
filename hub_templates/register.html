{% extends 'base.html' %}{% block title %}注册 · {{ site_name }}{% endblock %}{% block content %}
<section class="narrow"><div class="panel"><div class="section-head"><div><small>邀请制</small><h1>加入同行会</h1></div></div><form class="form-grid" method="post" action="{{ url_for('hub_register_submit') }}"><input type="hidden" name="_csrf" value="{{ csrf }}"><label>邀请码<input name="invite" value="{{ invite }}" required></label><label>用户名<input name="username" placeholder="英文、数字、下划线" required></label><label>显示名称<input name="display_name" placeholder="朋友看到的名字" required></label><label>密码<input type="password" name="password" minlength="8" required></label><label>确认密码<input type="password" name="password_confirm" minlength="8" required></label><button class="primary">创建账户</button><a class="button" href="{{ url_for('hub_home') }}">返回登录</a></form></div></section>{% endblock %}
