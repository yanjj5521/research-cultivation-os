openapi: 3.1.0
info:
  title: Research Cultivation OS Scalable Sync API
  version: 0.1.0-draft
  description: >
    Reserved v2 contract for a future multi-tenant backend. No production
    server implements this contract in v1.5.
servers:
  - url: https://sync.example.invalid
    description: Placeholder only
paths:
  /v2/capabilities:
    get:
      operationId: getCapabilities
      summary: Discover protocol and schema support
      responses:
        "200":
          description: Backend capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /v2/events/batch:
    post:
      operationId: pushEventBatch
      summary: Idempotently accept a batch of client events
      security:
        - oauth2: [sync.write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatch"
      responses:
        "200":
          description: Per-event acceptance results and new cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBatchResult"
        "409":
          description: Sequence conflict requiring a state refresh
        "429":
          description: Rate limit exceeded
  /v2/state:
    get:
      operationId: pullState
      summary: Pull changes after a stable cursor
      security:
        - oauth2: [sync.read]
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Incremental state changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatePage"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.invalid/authorize
          tokenUrl: https://identity.example.invalid/token
          scopes:
            sync.read: Read the caller's synchronized state
            sync.write: Submit the caller's synchronized events
  schemas:
    Capabilities:
      type: object
      required:
        - contract_version
        - event_schema_versions
        - max_batch_size
      properties:
        contract_version:
          type: string
        event_schema_versions:
          type: array
          items:
            type: integer
        max_batch_size:
          type: integer
        supports_cursor:
          type: boolean
        supports_tenants:
          type: boolean
    EventEnvelope:
      type: object
      additionalProperties: false
      required:
        - event_uuid
        - event_type
        - schema_version
        - aggregate_type
        - aggregate_id
        - sequence_no
        - occurred_at
        - payload
      properties:
        event_uuid:
          type: string
          format: uuid
        event_type:
          type: string
          maxLength: 60
        schema_version:
          type: integer
          minimum: 1
        aggregate_type:
          type: string
          maxLength: 60
        aggregate_id:
          type: string
          maxLength: 120
        sequence_no:
          type: integer
          minimum: 0
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
    EventBatch:
      type: object
      additionalProperties: false
      required:
        - device_id
        - events
      properties:
        device_id:
          type: string
          format: uuid
        cursor:
          type:
            - string
            - "null"
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/EventEnvelope"
    EventResult:
      type: object
      required:
        - event_uuid
        - status
      properties:
        event_uuid:
          type: string
          format: uuid
        status:
          type: string
          enum: [applied, duplicate, rejected, conflict]
        message:
          type: string
    EventBatchResult:
      type: object
      required:
        - results
        - cursor
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/EventResult"
        cursor:
          type: string
    StateChange:
      type: object
      required:
        - resource_type
        - resource_id
        - version
        - data
      properties:
        resource_type:
          type: string
        resource_id:
          type: string
        version:
          type: integer
        deleted:
          type: boolean
          default: false
        data:
          type: object
    StatePage:
      type: object
      required:
        - changes
        - cursor
        - has_more
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/StateChange"
        cursor:
          type: string
        has_more:
          type: boolean
