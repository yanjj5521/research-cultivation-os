[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wendao-research-v3"
version = "3.6.1"
description = "问道科研 3.0 体验：模块化内核与全新数据库"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "bleach>=6.2,<7",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "PyMuPDF>=1.24,<2",
]

[tool.setuptools]
py-modules = [
  "app", "content_library", "db", "desktop_pet", "desktop_shell", "extractors",
  "hub_app", "hub_db", "research_tools", "run_hub", "run_local", "runtime_paths",
  "version", "workspace_profiles",
]

[tool.setuptools.packages.find]
include = ["core*", "features*", "launchers*", "services*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
